<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waves | Афиша</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260610m" />
  </head>
  <body class="subpage" data-page="concerts">
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/">Waves</a>
        <nav class="nav" aria-label="Главная навигация">
          <a href="/concerts" data-i18n="nav.concerts">Афиша</a>
          <a href="/cabinet" data-i18n="nav.cabinet">Кабинет</a>
          <a href="/" data-i18n="nav.home">Главная</a>
        </nav>
        <div class="topbar-actions" aria-label="Авторизация">
          <div class="locale-switch" aria-label="Language switch">
            <a class="locale-button" href="?lang=ru" data-locale="ru">RU</a>
            <a class="locale-button" href="?lang=en" data-locale="en">EN</a>
          </div>
          <a class="ghost-button link-button" href="?auth=login" id="topbar-login-button" data-open-auth="login">войти</a>
          <a class="ghost-button link-button" href="?auth=register" id="topbar-signup-button" data-open-auth="register">регистрация</a>
          <button class="ghost-button" type="button" id="logout-button" hidden>выйти</button>
        </div>
      </header>

      <section class="page-intro">
        <h1 data-i18n="concerts.title">Афиша и поиск концертов</h1>
        <p data-i18n="concerts.subtitle">Ищите концерты по городу, жанру, датам и названию группы.</p>
      </section>

      <section class="workspace page-workspace" id="concerts">
        <div class="panel search-panel">
          <div class="panel-heading">
            <h2 data-i18n="concerts.filters">Фильтры</h2>
            <div class="panel-heading-actions">
              <span id="auth-state">гость</span>
              <button class="ghost-button compact filter-toggle" type="button" id="toggle-filters" data-i18n="concerts.filters_toggle_hide">Скрыть фильтры</button>
            </div>
          </div>

          <form class="search-form" id="search-form">
            <div class="city-filter wide" id="city-filter" aria-label="Фильтр по городам"></div>
            <div class="filter-fields wide" id="filter-fields">
            <label>
              <span data-i18n="concerts.city">Город</span>
              <input
                name="city"
                type="text"
                list="city-list"
                data-suggest-list="city-list"
                data-i18n-placeholder="concerts.city_placeholder"
                placeholder="Введите или выберите город"
                required
              />
              <datalist id="city-list">
                <option value="Москва"></option>
                <option value="Санкт-Петербург"></option>
                <option value="Казань"></option>
                <option value="Екатеринбург"></option>
                <option value="Новосибирск"></option>
                <option value="Нижний Новгород"></option>
                <option value="Самара"></option>
                <option value="Краснодар"></option>
                <option value="Сочи"></option>
                <option value="Уфа"></option>
                <option value="Красноярск"></option>
                <option value="London"></option>
                <option value="Berlin"></option>
                <option value="Paris"></option>
              </datalist>
            </label>
            <label>
              <span data-i18n="concerts.genre">Жанр</span>
              <input
                name="genre"
                type="text"
                list="genre-list"
                data-suggest-list="genre-list"
                data-i18n-placeholder="concerts.genre_placeholder"
                placeholder="Введите или выберите жанр"
              />
              <datalist id="genre-list">
                <option value="rock"></option>
                <option value="pop"></option>
                <option value="indie"></option>
                <option value="metal"></option>
                <option value="jazz"></option>
                <option value="electronic"></option>
                <option value="hip-hop"></option>
              </datalist>
            </label>
            <label>
              <span data-i18n="concerts.artist">Артист / группа</span>
              <input name="artist" type="search" data-i18n-placeholder="concerts.artist_placeholder" placeholder="Queen, Pyrokinesis..." />
            </label>
            <label>
              <span data-i18n="concerts.from">С</span>
              <input name="date_from" type="date" />
            </label>
            <label>
              <span data-i18n="concerts.to">По</span>
              <input name="date_to" type="date" />
            </label>
            <button class="primary-button wide" type="submit" data-i18n="concerts.search_local">Искать в базе</button>
            <button class="ghost-button wide internet-button" type="button" id="external-search" data-i18n="concerts.search_external">Искать во внешних источниках</button>
            </div>
          </form>
        </div>

        <div class="panel result-panel">
          <div class="panel-heading">
            <div>
              <h2 data-i18n="concerts.results">Результаты</h2>
              <p class="panel-subtitle result-summary" id="result-summary">Введите город, чтобы начать поиск</p>
            </div>
            <div class="result-toolbar">
              <label class="toolbar-select">
                <span data-i18n="concerts.sort">Сортировка</span>
                <select id="catalog-sort">
                  <option value="date-asc" data-i18n="concerts.sort_date">Сначала ближайшие</option>
                  <option value="price-asc" data-i18n="concerts.sort_price_low">Сначала дешевле</option>
                  <option value="price-desc" data-i18n="concerts.sort_price_high">Сначала дороже</option>
                  <option value="tickets-desc" data-i18n="concerts.sort_tickets">Больше билетов</option>
                </select>
              </label>
              <button class="ghost-button compact" type="button" id="load-tickets" data-i18n="concerts.my_tickets">мои билеты</button>
            </div>
          </div>
          <div class="result-list" id="result-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <dialog class="auth-dialog concert-dialog" id="concert-detail-dialog">
      <article class="auth-card concert-detail-card">
        <button class="close-button" type="button" id="close-concert-detail" aria-label="Закрыть">x</button>
        <div id="concert-detail-content"></div>
      </article>
    </dialog>

    <dialog class="auth-dialog" id="auth-dialog">
      <form class="auth-card" id="auth-form" method="dialog">
        <button class="close-button" type="button" id="close-auth" aria-label="Закрыть">x</button>
        <h2 id="auth-title" data-i18n="auth.login_title">Вход</h2>
        <label>
          <span data-i18n="auth.email">Email</span>
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>
          <span data-i18n="auth.password">Пароль</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <div class="register-fields" id="register-fields">
          <label>
            <span data-i18n="auth.first_name">Имя</span>
            <input name="first_name" type="text" autocomplete="given-name" />
          </label>
          <label>
            <span data-i18n="auth.last_name">Фамилия</span>
            <input name="last_name" type="text" autocomplete="family-name" />
          </label>
        </div>
        <button class="primary-button wide" type="submit" id="auth-submit" data-i18n="auth.login_button">Войти</button>
        <p class="form-message" id="auth-message" aria-live="polite"></p>
      </form>
    </dialog>

    <script src="/static/js/cabinet.js?v=20260610m" defer></script>
    <script src="/static/app.js?v=20260610m" defer></script>
  </body>
</html>
