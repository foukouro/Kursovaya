<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cabinet | Waves</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="subpage">
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/">Waves</a>
        <nav class="nav" aria-label="Главная навигация">
          <a href="/concerts">Concert</a>
          <a href="/cabinet">Cabinet</a>
          <a href="/">Home</a>
        </nav>
        <div class="topbar-actions" aria-label="Авторизация">
          <button class="ghost-button" type="button" id="topbar-login-button" data-open-auth="login">log in</button>
          <button class="ghost-button" type="button" id="topbar-signup-button" data-open-auth="register">sign up</button>
          <button class="ghost-button" type="button" id="logout-button" hidden>logout</button>
        </div>
      </header>

      <section class="page-intro">
        <h1>Personal cabinet</h1>
        <p>Рабочая зона пользователя, администратора, менеджера или музыканта.</p>
        <div class="auth-actions page-actions" aria-label="Авторизация">
          <button class="primary-button" type="button" id="hero-login-button" data-open-auth="login">log in</button>
          <button class="ghost-button" type="button" id="hero-signup-button" data-open-auth="register">sign up</button>
        </div>
      </section>

      <datalist id="genre-list">
        <option value="rock"></option>
        <option value="pop"></option>
        <option value="indie"></option>
        <option value="metal"></option>
        <option value="jazz"></option>
        <option value="electronic"></option>
        <option value="hip-hop"></option>
      </datalist>

      <section class="cabinet cabinet-page" id="cabinet" aria-label="Личный кабинет">
        <div class="panel cabinet-panel">
          <div class="panel-heading">
            <div>
              <h2>Workspace</h2>
              <p class="panel-subtitle" id="cabinet-subtitle">Log in to open your workspace</p>
            </div>
          </div>
          <div class="cabinet-content" id="cabinet-content">
            <div class="result-card no-poster">
              <span class="result-meta">Use log in or sign up to continue.</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <dialog class="auth-dialog" id="auth-dialog">
      <form class="auth-card" id="auth-form" method="dialog">
        <button class="close-button" type="button" id="close-auth" aria-label="Закрыть">x</button>
        <h2 id="auth-title">log in</h2>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <div class="register-fields" id="register-fields">
          <label>
            First name
            <input name="first_name" type="text" autocomplete="given-name" />
          </label>
          <label>
            Last name
            <input name="last_name" type="text" autocomplete="family-name" />
          </label>
        </div>
        <button class="primary-button wide" type="submit" id="auth-submit">log in</button>
        <p class="form-message" id="auth-message"></p>
      </form>
    </dialog>

    <script src="/static/app.js" defer></script>
  </body>
</html>
