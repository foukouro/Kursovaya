<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waves | Кабинет</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260610m" />
  </head>
  <body class="subpage" data-page="cabinet">
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/">Waves</a>
        <nav class="nav" aria-label="Главная навигация">
          <a href="/concerts" data-i18n="nav.concerts">Афиша</a>
          <a href="/cabinet" data-i18n="nav.cabinet">Кабинет</a>
          <a href="/" data-i18n="nav.home">Главная</a>
        </nav>
        <div class="topbar-actions" aria-label="Авторизация">
          <div class="locale-switch" aria-label="Language switch">
            <a class="locale-button" href="?lang=ru" data-locale="ru">RU</a>
            <a class="locale-button" href="?lang=en" data-locale="en">EN</a>
          </div>
          <a class="ghost-button link-button" href="?auth=login" id="topbar-login-button" data-open-auth="login">войти</a>
          <a class="ghost-button link-button" href="?auth=register" id="topbar-signup-button" data-open-auth="register">регистрация</a>
          <button class="ghost-button" type="button" id="logout-button" hidden>выйти</button>
        </div>
      </header>

      <section class="page-intro">
        <h1 data-i18n="cabinet.title">Личный кабинет Waves</h1>
        <p data-i18n="cabinet.subtitle">Единая рабочая зона для зрителя, музыканта, менеджера и администратора.</p>
        <div class="auth-actions page-actions" aria-label="Авторизация">
          <a class="primary-button link-button" href="?auth=login" id="hero-login-button" data-open-auth="login">войти</a>
          <a class="ghost-button link-button" href="?auth=register" id="hero-signup-button" data-open-auth="register">регистрация</a>
        </div>
      </section>

      <datalist id="genre-list">
        <option value="rock"></option>
        <option value="pop"></option>
        <option value="indie"></option>
        <option value="metal"></option>
        <option value="jazz"></option>
        <option value="electronic"></option>
        <option value="hip-hop"></option>
      </datalist>

      <section class="cabinet cabinet-page" id="cabinet" aria-label="Личный кабинет">
        <div class="panel cabinet-panel">
          <div class="panel-heading">
            <div>
              <h2 data-i18n="cabinet.workspace">Рабочее пространство</h2>
              <p class="panel-subtitle" id="cabinet-subtitle" data-i18n="cabinet.login_prompt">Войдите, чтобы открыть кабинет</p>
            </div>
          </div>
          <div class="cabinet-content" id="cabinet-content">
            <div class="result-card no-poster">
              <span class="result-meta" data-i18n="cabinet.continue_prompt">Войдите или зарегистрируйтесь, чтобы продолжить.</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <dialog class="auth-dialog" id="auth-dialog">
      <form class="auth-card" id="auth-form" method="dialog">
        <button class="close-button" type="button" id="close-auth" aria-label="Закрыть">x</button>
        <h2 id="auth-title" data-i18n="auth.login_title">Вход</h2>
        <label>
          <span data-i18n="auth.email">Email</span>
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>
          <span data-i18n="auth.password">Пароль</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <div class="register-fields" id="register-fields">
          <label>
            <span data-i18n="auth.first_name">Имя</span>
            <input name="first_name" type="text" autocomplete="given-name" />
          </label>
          <label>
            <span data-i18n="auth.last_name">Фамилия</span>
            <input name="last_name" type="text" autocomplete="family-name" />
          </label>
        </div>
        <button class="primary-button wide" type="submit" id="auth-submit" data-i18n="auth.login_button">Войти</button>
        <p class="form-message" id="auth-message" aria-live="polite"></p>
      </form>
    </dialog>

    <script src="/static/js/cabinet.js?v=20260610m" defer></script>
    <script src="/static/app.js?v=20260610m" defer></script>
  </body>
</html>
